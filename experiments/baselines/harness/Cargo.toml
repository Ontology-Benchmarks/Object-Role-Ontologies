[package]
name = "baseline-harness"
version = "0.1.0"
edition = "2021"

# Standalone workspace: depends on the cloned OCPQ checkout so that OCPQ and OC-DECLARE run on
# exactly the process_mining revision pinned by OCPQ's Cargo.lock (copied next to this file).
[workspace]

[dependencies]
ocpq-core = { path = "../ocpq/backend/ocpq-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
